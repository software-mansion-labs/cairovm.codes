name: Release

# Builds the image and pushes it to Artifact Registry. It does NOT deploy.
#
# A release (a tag push, or a manual run on main) then asks starkloupe-infra to
# promote the image: a repository_dispatch there records its digest in a pull
# request against releases/cairovm-codes.json. Merging that and running
# starkloupe-infra's Terraform Apply workflow is what deploys it.
#
# This is the third repository to release this way; starknet-debugger-server and
# starknet-debugger-app carry the same workflow.

on:
  push:
    tags: ["v[0-9]+.*"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required to mint the Workload Identity token

env:
  REGION: us-central1
  IMAGE: us-central1-docker.pkg.dev/software-mansion-dev/walnut/cairovm-codes

jobs:
  release:
    name: build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No service account key anywhere: the identity pool provider in
      # walnut-infra/iam.tf is locked to this repository by name, and this
      # repository has its own deployer service account so a token minted here
      # cannot push under another service's image name.
      #
      # Both variables are repository-level Actions *variables*, not secrets,
      # and both come from `terraform output` in walnut-infra:
      #
      #   WIF_PROVIDER -> workload_identity_provider
      #   DEPLOYER_SA  -> cairovm_deployer_service_account
      #
      # Note this repository is a fork: only the software-mansion-labs remote is
      # admitted to the pool, so a run on walnuthq/cairovm.codes cannot
      # authenticate here. That is intended, not a misconfiguration.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@v3

      # On a tag push github.ref_name is the tag (v1.2.3), but on a manual
      # dispatch it is the branch name - and a branch name may contain "/",
      # which is not a legal character in a Docker tag. Manual runs are tagged
      # with the commit SHA instead, which is also how walnut-infra pins the
      # image it deploys.
      #
      # "latest" is only moved by a real release. A dispatch from a branch must
      # not repoint the tag that releases track.
      - name: Resolve image tags
        id: tags
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="git-$GITHUB_SHA"
          fi
          {
            echo "image=${IMAGE}:${tag}"
            echo "list<<EOF"
            echo "${IMAGE}:${tag}"
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              echo "${IMAGE}:latest"
              echo "${IMAGE}:git-${GITHUB_SHA}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # starkloupe-infra checks the labels and the provenance before
      # it records a digest. Single platform on purpose: it reads the labels
      # with `imagetools inspect`, which returns none for a multi-platform index.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: mode=max
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_CAIRO_VM_API_URL=${{ vars.NEXT_PUBLIC_CAIRO_VM_API_URL || 'wss://codeapi.starkloupe.co/ws' }}

      - name: Pushed image
        env:
          PUSHED_IMAGE: ${{ steps.tags.outputs.image }}
        run: |
          {
            echo "### Image pushed"
            echo
            echo '```'
            echo "${PUSHED_IMAGE}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Only releases are promoted: a manual run from a branch still builds and
      # pushes, but asks for nothing.
      - name: Create starkloupe-infra dispatch token
        id: infra-token
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: software-mansion
          repositories: starkloupe-infra
          permission-contents: write

      - name: Request promotion in starkloupe-infra
        if: steps.infra-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.infra-token.outputs.token }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          gh api \
            --method POST \
            repos/software-mansion/starkloupe-infra/dispatches \
            --field event_type=cairovm-codes-release \
            --field "client_payload[source_commit]=${GITHUB_SHA}" \
            --field "client_payload[digest]=${DIGEST}"
